name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v0.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          test "$RELEASE_TAG" = "$(printf '%s' "$RELEASE_TAG")"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set DCN version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: printf '%s\n' "$RELEASE_TAG" > pkg/ams/dcn/VERSION

      - name: Run tests
        run: go test ./...

      - name: Commit version and create tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/ams/dcn/VERSION
          git diff --cached --quiet || git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin HEAD:${{ github.event.repository.default_branch }} "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --generate-notes